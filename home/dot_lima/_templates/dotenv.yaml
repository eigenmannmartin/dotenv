# dotenv Lima template — an Ubuntu VM that bootstraps this repo on first boot.
#
# Referenced as template://dotenv because $LIMA_HOME/_templates is searched first
# (and shadows bundled templates of the same name). Driven by ~/.local/bin/vm:
#
#   vm new scratch                 # core only — shell, nothing else
#   vm new work --profile dev      # + neovim/lazygit/node
#   vm new hsg  --profile vpn      # + openconnect/cisco-vpn
#
# Every knob is a param, because `limactl --param K=V` is REJECTED unless the
# template declares K here. Params arrive in provision scripts as $PARAM_<K>.
minimumLimaVersion: "1.1.0"

# NOT `template://ubuntu` — that is `_images/ubuntu` + `_default/mounts`, and the
# latter shares your whole home directory into the guest. Basing on the image alone
# is the only way to opt out: a child template CANNOT unset an inherited mount
# (`mounts: []` merges to no effect, verified), and `limactl --mount-none` is
# rejected alongside `--mount`, so it cannot be undone from the CLI either. `vm`
# appends exactly the directories you ask for with --mount.
base: template://_images/ubuntu

mounts:
# Lima's own scratch dir. Not user data, and some lima subcommands stage files
# through it, so it is the one default mount worth keeping.
- location: "{{.GlobalTempDir}}/lima"
  mountPoint: /tmp/lima
  writable: true

ssh:
  # Forward the host SSH agent — on the Mac that is 1Password's, so git push and
  # SSH commit signing work in the VM with no key material ever entering it.
  forwardAgent: true

param:
  Features: "core"
  Repo: "https://github.com/eigenmannmartin/dotenv.git"
  Ref: "main"
  # Host path of the shared login store, mounted writable by `vm` (Lima keeps the
  # host path in the guest, so this doubles as the guest path). Empty = not shared,
  # and every login in this VM dies with it. See ~/.local/bin/dotenv-persist.
  PersistDir: ""

provision:
# Root, before the user script: just enough to fetch the repo. Everything else is
# the repo's own install.sh, so this list stays short and the logic stays in git.
- mode: dependency
  script: |
    #!/bin/bash
    set -eu -o pipefail
    command -v git >/dev/null && command -v curl >/dev/null && exit 0
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    apt-get install -y -qq --no-install-recommends git curl ca-certificates

# Runs as the normal user via `sudo -iu` (a login shell, cwd = home).
- mode: user
  script: |
    #!/bin/bash
    set -eu -o pipefail
    SRC="$HOME/.local/share/dotenv"
    STAMP="$HOME/.local/state/dotenv-provisioned"
    mkdir -p "$(dirname "$STAMP")" "$HOME/.config/dotenv"

    if [ -d "$SRC/.git" ]; then
      git -C "$SRC" fetch --prune origin || true
      git -C "$SRC" checkout "$PARAM_Ref" || true
      git -C "$SRC" pull --ff-only || true
    else
      git clone --branch "$PARAM_Ref" "$PARAM_Repo" "$SRC"
    fi

    # Where the shared logins live, for dotenv-persist. Written before install.sh so
    # the chezmoi run_after script can link them in the same pass.
    if [ -n "${PARAM_PersistDir:-}" ]; then
      printf '%s\n' "$PARAM_PersistDir" > "$HOME/.config/dotenv/persist-dir"
    else
      rm -f "$HOME/.config/dotenv/persist-dir"
    fi

    # install.sh freezes DOTENV_FEATURES into ~/.config/chezmoi/chezmoi.toml, so
    # later bare `chezmoi apply` runs in this VM keep the same feature set.
    DOTENV_FEATURES="$PARAM_Features" "$SRC/install.sh"
    touch "$STAMP"

# A failing provision script does NOT fail `limactl start` — boot.sh only WARNs and
# still writes the boot-done marker. A readiness probe is the only way the failure
# reaches the CLI instead of leaving you with a half-built VM that looks fine.
probes:
- mode: readiness
  description: dotenv dotfiles applied
  script: |
    #!/bin/bash
    set -eu
    test -e "$HOME/.local/state/dotenv-provisioned"
  hint: |
    dotfiles provisioning did not finish.
    Look at /var/log/cloud-init-output.log inside the VM.
