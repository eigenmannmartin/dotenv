# --- Terminal / truecolor -------------------------------------------------
set -g  default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"   # legacy truecolor for xterm-like host TERMs
set -as terminal-features ",*:RGB"         # TERM-agnostic truecolor (matters inside containers)
set -g  mouse on
set -sg escape-time 10
set -g  focus-events on
set -g  set-clipboard on
set -g  allow-passthrough on

# --- Prefix: C-a ----------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# --- Catppuccin (v2 API): options MUST be set BEFORE tpm loads the plugin --
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_current_text ' #{b:pane_current_path}'

# --- Session persistence: resurrect + continuum ---------------------------
# Auto-saves every 15 min and auto-restores on tmux server start, so a restart
# or reboot drops you back into your panes/layout/cwd. prefix+Ctrl-s saves now,
# prefix+Ctrl-r restores manually.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Plugins (tpm) --------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep continuum last

run '~/.tmux/plugins/tpm/tpm'

# --- Status line (v2): build AFTER the plugin is loaded -------------------
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -agF status-right '#{E:@catppuccin_status_session}'

# --- Copy mode (vi) -------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Splits keep cwd ------------------------------------------------------
bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind-key L swap-window -t -1
