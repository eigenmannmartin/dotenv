set -g  default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"   # legacy truecolor for xterm-like host TERMs
set -as terminal-features ",*:RGB"         # TERM-agnostic truecolor (matters inside containers)
set -g  mouse on
set -sg escape-time 10
set -g  focus-events on
set -g  set-clipboard on
set -g  allow-passthrough on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n S-Left  previous-window
bind -n S-Right next-window

bind -n M-H previous-window
bind -n M-L next-window

# catppuccin v2: options MUST be set before tpm loads the plugin
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_position 'right'
# without @catppuccin_window_text, unfocused windows fall back to long auto-renamed command
set -g @catppuccin_window_text ' #{b:pane_current_path}'
set -g @catppuccin_window_current_text ' #{b:pane_current_path}'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_host_text ' #{host_short}'

# auto-save every 15min, auto-restore on server start; prefix+C-s saves, prefix+C-r restores
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
# extrakto: prefix+Tab → fuzzy-grab paths/SHAs/pod-names/URLs off the screen
set -g @plugin 'laktak/extrakto'
set -g @extrakto_popup_size '70%'
set -g @extrakto_clip_mode 'tmux_osc52'   # OSC52 → works over SSH (set-clipboard already on)
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_grab_area 'full'         # current pane's full scrollback
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep continuum last

run '~/.tmux/plugins/tpm/tpm'

# status line built AFTER plugin load
set -g status-left-length 100
set -g status-right-length 100
# project badge color/initial set per-session by zsh _dotenv_project_badge hook; @thm_blue/"·" are fallbacks
set -g status-left "#[fg=#{@thm_crust},bg=#{@dotenv_project_color}] #{@dotenv_project_initial} #[default] "
# IP probes active iface on macOS (en0/en1), falls back to Linux `hostname -I`
set -g status-right ''
set -ag status-right '#{E:@catppuccin_status_host}'
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_blue}]  #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || hostname -I 2>/dev/null | awk '{print $1}') #[default]"
set -ag status-right '#{E:@catppuccin_status_session}'

# catppuccin hard-sets current text fg to @thm_fg (unreadable on pastels), so we own the whole current-window format here, after plugin load
set -gq @dotenv_project_color "#8aadf4"
set -gq @dotenv_project_initial "·"
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@dotenv_project_color}] #{b:pane_current_path} #I "

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# M- = RIGHT Option per kitty config
bind -n M-f display-popup -E -w 60% -h 60% -T ' projects ' "~/.local/bin/tmux-sessionizer"
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind-key L swap-window -t -1
