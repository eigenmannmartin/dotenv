set -g  default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"   # legacy truecolor for xterm-like host TERMs
set -as terminal-features ",*:RGB"         # TERM-agnostic truecolor (matters inside containers)
set -g  mouse on
# tmux 3.6's default MouseDrag1Pane (3.6a reverted it) hands the drag to any app on
# the ALTERNATE screen even when it never enabled mouse reporting (plain `less`) —
# the drag then dies inside the app and nothing is marked or copied.
# Gate on mouse_any_flag alone: apps that really track the mouse (nvim, fzf, btop)
# still get it; everything else gets tmux copy-mode, so drag-to-copy (tmux's own
# copy-pipe → set-clipboard/OSC52) works there too. Wheel binding is left at default
# on purpose: from 3.6 on, alternate_on there is what turns wheel events into arrow
# keys for less.
bind -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
set -sg escape-time 10
set -g  focus-events on
# Every copy (mouse drag, `y` in copy mode) creates a tmux buffer, and set-clipboard on
# makes tmux pass it to the outer terminal as OSC 52 — so it reaches the system
# clipboard over ssh and from inside a Lima VM too.
set -g  set-clipboard on
set -g  allow-passthrough on

set -g  history-limit 50000
set -g  display-time 4000                  # messages stay up 4s instead of 0.75s
set -g  status-interval 5                  # re-run the status-right IP probe every 5s
# tmux flips the command prompt (prefix + :) to vi keys whenever $EDITOR/$VISUAL
# contains "vi" — EDITOR=nvim does. Keep emacs there; copy mode is vi (mode-keys below).
set -g  status-keys emacs
setw -g aggressive-resize on               # size a window by the clients that have it as their current window, not by every client of its session

unbind C-b
set -g prefix C-a
# Nested tmux: send ONE prefix through to the inner session (a VM's tmux, or one on a
# host you ssh'd into). `C-a C-a c` opens a window in the inner tmux.
bind C-a send-prefix
# C-a a toggles to the last window; C-a C-p / C-a C-n step through windows without
# letting go of Ctrl.
bind a   last-window
bind C-p previous-window
bind C-n next-window

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"   # capital R works too

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-H previous-window
bind -n M-L next-window

# catppuccin v2: options MUST be set before the plugin loads
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_number_position 'right'
# without @catppuccin_window_text, unfocused windows fall back to long auto-renamed command
set -g @catppuccin_window_text ' #{b:pane_current_path}'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_host_text ' #{host_short}'

# extrakto: prefix+Tab → fuzzy-grab paths/SHAs/pod-names/URLs off the screen
set -g @extrakto_popup_size '70%'
set -g @extrakto_clip_mode 'tmux_osc52'   # OSC52 → works over SSH (set-clipboard already on)
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_grab_area 'full'         # current pane's full scrollback

# Plugins are fetched by chezmoi (.chezmoiexternal.toml: catppuccin as a pinned
# release archive, extrakto as a git checkout it refreshes weekly); nothing manages
# them at runtime. `run` without -b blocks, so catppuccin has finished setting its own
# window-status-current-format and status-style before the lines below override them.
# The test keeps a box that chezmoi has not fetched them onto yet quiet: a plain bar
# instead of an error.
if-shell 'test -f ~/.tmux/plugins/catppuccin/catppuccin.tmux' { run '~/.tmux/plugins/catppuccin/catppuccin.tmux' }
if-shell 'test -f ~/.tmux/plugins/extrakto/extrakto.tmux' { run '~/.tmux/plugins/extrakto/extrakto.tmux' }

# status line built AFTER plugin load
set -g status-left-length 100
set -g status-right-length 100
# project badge color/initial set per-window by zsh _dotenv_project_badge hook; the #8aadf4 (Macchiato blue)/"·" globals below are fallbacks
set -g status-left "#[fg=#{@thm_crust},bg=#{@dotenv_project_color}] #{@dotenv_project_initial} #[default] "
# IP probes the active iface on macOS (en0/en1), falls back to Linux `hostname -I`.
# Gated on `command -v` so Linux doesn't fork two guaranteed-to-fail ipconfig processes
# on every status refresh.
set -g status-right ''
set -ag status-right '#{E:@catppuccin_status_host}'
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_blue}]  #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(command -v ipconfig >/dev/null 2>&1 && { ipconfig getifaddr en0 || ipconfig getifaddr en1; } 2>/dev/null || hostname -I 2>/dev/null | awk '{print $1}') #[default]"
set -ag status-right '#{E:@catppuccin_status_session}'

# catppuccin hard-sets current text fg to @thm_fg (unreadable on pastels), so we own the whole current-window format here, after plugin load
set -gq @dotenv_project_color "#8aadf4"
set -gq @dotenv_project_initial "·"
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@dotenv_project_color}] #{b:pane_current_path} #I "

# Nested tmux: tint the bar when this tmux server is NOT on the Mac.
# Stack a Lima VM's tmux inside the Mac's and you get two status bars an inch apart
# that are otherwise identical; this makes the inner one visibly lighter, with a warm
# active-pane border, so "which session did that keystroke go to" is answerable at a
# glance instead of by experiment.
#
# Runs after the plugin so it wins over catppuccin's own status-style.
#
# Detection is deliberately crude — SSH_CONNECTION covers anything you ssh'd into,
# the hostname test covers `limactl shell`, which sets no ssh variables at all. The
# tmux server inherits whichever was true when it started, and it outlives the
# connection, so treat this as a strong hint rather than proof.
if-shell '[ -n "$SSH_CONNECTION" ] || hostname -s | grep -q "^lima-"' \
  "set -g status-style 'fg=#cad3f5,bg=#363a4f' ; set -g pane-active-border-style 'fg=#f5a97f'"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# M- = RIGHT Option per kitty config
bind -n M-f display-popup -E -w 60% -h 60% -T ' projects ' "~/.local/bin/tmux-sessionizer"
# M-s: ssh + port-forward launcher (fzf over ~/.ssh/config hosts + ~/.config/ssh-launch/targets); opens a named window
bind -n M-s display-popup -E -w 60% -h 70% -T ' ssh + forward ' "~/.local/bin/ssh-launch"
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind-key L swap-window -t -1
