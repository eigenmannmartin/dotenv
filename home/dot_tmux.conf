set -g  default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"   # legacy truecolor for xterm-like host TERMs
set -as terminal-features ",*:RGB"         # TERM-agnostic truecolor (matters inside containers)
# Belt-and-braces for OSC52: force the `Ms` clipboard setter for TERMs whose terminfo
# lacks it. A no-op when terminfo is correct (kitty's ships Ms). It canNOT rescue a
# MISSING terminfo entry — tmux refuses to start before it ever reads this file; that's
# what the 25-terminfo chezmoi script is for.
set -as terminal-features ",xterm-kitty:clipboard,screen*:clipboard"
set -g  mouse on
set -sg escape-time 10
set -g  focus-events on
set -g  set-clipboard on
set -g  allow-passthrough on

unbind C-b
set -g prefix C-a
# Nested tmux, shortcut 1 of 2: send ONE prefix through to the inner session.
# `C-a C-a c` opens a window in the inner tmux. Fine for a one-off, tedious for a
# whole working session — that is what F12 below is for.
bind C-a send-prefix

# Nested tmux, shortcut 2 of 2: F12 switches the OUTER session off completely.
# Its prefix is unset and its key table swapped for an empty one, so every key —
# including a bare C-a — falls through to whatever is running inside (the VM's tmux,
# or a full-screen TUI). Press F12 again to take control back.
#
# The status bar goes flat grey while it is off; that is deliberate and is the whole
# "which tmux am I typing at" signal. Colors are literal rather than #{@thm_*}
# because a style set from inside a key binding is not format-expanded.
#
# Whichever tmux is OUTERMOST always wins F12, because it reads the terminal first —
# so the key never means anything ambiguous.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#6e738d,bg=#181926" \;\
  set window-status-current-style "fg=#6e738d,bg=#181926" \;\
  display-message "outer tmux OFF — keys pass through (F12 to take it back)" \;\
  refresh-client -S

# Only keys bound in the `off` table do anything while it is off — this is the door.
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  display-message "outer tmux back on" \;\
  refresh-client -S

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-H previous-window
bind -n M-L next-window

# catppuccin v2: options MUST be set before tpm loads the plugin
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_position 'right'
# without @catppuccin_window_text, unfocused windows fall back to long auto-renamed command
set -g @catppuccin_window_text ' #{b:pane_current_path}'
set -g @catppuccin_window_current_text ' #{b:pane_current_path}'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_host_text ' #{host_short}'

# auto-save every 15min, auto-restore on server start; prefix+C-s saves, prefix+C-r restores
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'   # y / mouse-drag copy → system clipboard (also the k9s copy path)
# extrakto: prefix+Tab → fuzzy-grab paths/SHAs/pod-names/URLs off the screen
set -g @plugin 'laktak/extrakto'
set -g @extrakto_popup_size '70%'
set -g @extrakto_clip_mode 'tmux_osc52'   # OSC52 → works over SSH (set-clipboard already on)
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_grab_area 'full'         # current pane's full scrollback
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep continuum last

run '~/.tmux/plugins/tpm/tpm'

# status line built AFTER plugin load
set -g status-left-length 100
set -g status-right-length 100
# project badge color/initial set per-session by zsh _dotenv_project_badge hook; @thm_blue/"·" are fallbacks
set -g status-left "#[fg=#{@thm_crust},bg=#{@dotenv_project_color}] #{@dotenv_project_initial} #[default] "
# IP probes the active iface on macOS (en0/en1), falls back to Linux `hostname -I`.
# Gated on `command -v` so Linux doesn't fork two guaranteed-to-fail ipconfig processes
# on every status refresh.
set -g status-right ''
set -ag status-right '#{E:@catppuccin_status_host}'
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_blue}]  #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(command -v ipconfig >/dev/null 2>&1 && { ipconfig getifaddr en0 || ipconfig getifaddr en1; } 2>/dev/null || hostname -I 2>/dev/null | awk '{print $1}') #[default]"
set -ag status-right '#{E:@catppuccin_status_session}'

# catppuccin hard-sets current text fg to @thm_fg (unreadable on pastels), so we own the whole current-window format here, after plugin load
set -gq @dotenv_project_color "#8aadf4"
set -gq @dotenv_project_initial "·"
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@dotenv_project_color}] #{b:pane_current_path} #I "

# Nested tmux, the colour half: tint the bar when this tmux server is NOT on the Mac.
# Stack a Lima VM's tmux inside the Mac's and you get two status bars an inch apart
# that are otherwise identical; this makes the inner one visibly lighter, with a warm
# active-pane border, so "which session did that keystroke go to" is answerable at a
# glance instead of by experiment.
#
# Runs after the plugin so it wins over catppuccin's own status-style. Set GLOBALLY
# on purpose: F12 above overrides it per session and restores with `set -u`, which
# falls back to exactly this.
#
# Detection is deliberately crude — SSH_CONNECTION covers anything you ssh'd into,
# the hostname test covers `limactl shell`, which sets no ssh variables at all. The
# tmux server inherits whichever was true when it started, and it outlives the
# connection, so treat this as a strong hint rather than proof.
if-shell '[ -n "$SSH_CONNECTION" ] || hostname -s | grep -q "^lima-"' \
  "set -g status-style 'fg=#cad3f5,bg=#363a4f' ; set -g pane-active-border-style 'fg=#f5a97f'"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# M- = RIGHT Option per kitty config
bind -n M-f display-popup -E -w 60% -h 60% -T ' projects ' "~/.local/bin/tmux-sessionizer"
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind-key L swap-window -t -1
