# --- Terminal / truecolor -------------------------------------------------
set -g  default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"   # legacy truecolor for xterm-like host TERMs
set -as terminal-features ",*:RGB"         # TERM-agnostic truecolor (matters inside containers)
set -g  mouse on
set -sg escape-time 10
set -g  focus-events on
set -g  set-clipboard on
set -g  allow-passthrough on

# --- Prefix: C-a ----------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# --- Catppuccin (v2 API): options MUST be set BEFORE tpm loads the plugin --
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_position 'right'
# Short, consistent labels: the cwd basename for BOTH focused and unfocused
# windows. Without @catppuccin_window_text, unfocused windows fall back to the
# default ' #T' (the auto-renamed running command — often very long).
set -g @catppuccin_window_text ' #{b:pane_current_path}'
set -g @catppuccin_window_current_text ' #{b:pane_current_path}'
# Status modules: square (block) — no separators/caps — + short hostname.
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_host_text ' #{host_short}'

# --- Session persistence: resurrect + continuum ---------------------------
# Auto-saves every 15 min and auto-restores on tmux server start, so a restart
# or reboot drops you back into your panes/layout/cwd. prefix+Ctrl-s saves now,
# prefix+Ctrl-r restores manually.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Plugins (tpm) --------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
# extrakto: prefix+Tab → fuzzy-grab paths/SHAs/pod-names/URLs off the screen
set -g @plugin 'laktak/extrakto'
set -g @extrakto_popup_size '70%'
set -g @extrakto_clip_mode 'tmux_osc52'   # OSC52 → works over SSH (set-clipboard already on)
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_grab_area 'full'         # current pane's full scrollback
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep continuum last

run '~/.tmux/plugins/tpm/tpm'

# --- Status line (v2): build AFTER the plugin is loaded -------------------
set -g status-left-length 100
set -g status-right-length 100
# Persistent project badge (always visible, far left): the project's capital
# first initial on its color, mirroring the prompt's ▎ badge. zsh's
# _dotenv_project_badge hook sets @dotenv_project_color / @dotenv_project_initial
# per session on cd; the @thm_blue / "·" globals below are the fallback.
set -g status-left "#[fg=#{@thm_crust},bg=#{@dotenv_project_color}] #{@dotenv_project_initial} #[default] "
# Bottom-right: Catppuccin modules (host · session — maintained, block style)
# with a small custom IP block between them (no built-in IP module). IP probes
# the active iface on macOS (en0/en1), falls back to Linux `hostname -I`.
set -g status-right ''
set -ag status-right '#{E:@catppuccin_status_host}'
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_blue}]  #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || hostname -I 2>/dev/null | awk '{print $1}') #[default]"
set -ag status-right '#{E:@catppuccin_status_session}'

# Active window indicator: colored PER-PROJECT to mirror the prompt's ▎ badge.
# zsh's _dotenv_project_badge hook pushes a per-session @dotenv_project_color on
# cd; the global below is the fallback (blue) for windows outside ~/code. Dark
# @thm_crust text stays readable on every (pastel) palette color. catppuccin
# hard-sets the current text fg to @thm_fg (unreadable on these), so we own the
# whole current-window format here, AFTER the plugin loads. Values resolve at
# render; #I / pane path stay live, so plain `set -g` (not -F).
set -gq @dotenv_project_color "#8aadf4"
set -gq @dotenv_project_initial "·"
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@dotenv_project_color}] #{b:pane_current_path} #I "

# --- Copy mode (vi) -------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Splits keep cwd ------------------------------------------------------
bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# --- Popups & launchers ---------------------------------------------------
# M-f (no prefix): fzf project switcher — each ~/code project becomes a session
# (lights up the per-project color bar). M- = RIGHT Option per kitty config.
bind -n M-f display-popup -E -w 60% -h 60% -T ' projects ' "~/.local/bin/tmux-sessionizer"
# prefix+g: lazygit in a centered popup (no-ops gracefully if not installed).
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind-key L swap-window -t -1
