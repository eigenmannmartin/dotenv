# Seeds `features` so every template can reference it on every machine (.chezmoiignore
# aborts the whole apply on a missing key). It only applies where
# ~/.config/chezmoi/chezmoi.toml has no features key of its own; `chezmoi init`
# (home/.chezmoi.toml.tmpl) always writes one, after which this value is shadowed.
# Keep the KNOWN-FEATURE LIST below in sync with $known in that template.
#
# Groups (see home/.chezmoiscripts/run_onchange_after_20-install-packages.sh.tmpl and
# the Brewfiles):
#   core     shell only — zsh (+ fzf-tab, autosuggestions, fast-syntax-highlighting,
#            zsh-abbr), tmux (+ catppuccin, extrakto), terminfo, oh-my-posh, atuin,
#            fzf/ripgrep/bat/eza/zoxide/delta/fd; kitty + lima on macOS
#   devlite  neovim + LazyVim, lazygit, worktrunk (wt), node + pnpm/prettier, jq, yq,
#            gh (+ gh-dash), direnv, pre-commit, git-lfs; a C compiler on Linux
#   dev      devlite + the container layer (OrbStack on macOS; lazydocker/dive)
#   k8s      sofka (+ its config), helm, argocd, helmfmt; kubecolor/kubectx/stern on
#            macOS; kubectl too on Linux, where OrbStack can't supply it
#   vpn      openconnect + openconnect-saml (the cisco-vpn command)
#   ai       claude + codex + backlog (npm)
#   docker   docker engine inside a Linux VM (macOS gets it from OrbStack via dev)
#   flutter  fvm + cocoapods for Flutter/iOS work (macOS only; Xcode from the App Store)
#
# Choose per machine with:  DOTENV_FEATURES=core,devlite ./install.sh
features = ["core"]
