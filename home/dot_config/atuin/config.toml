# atuin — login once per machine: `atuin login -u <user> -p <pass> -k <key>` then `atuin sync` (creds in 1Password)
# Encryption key never leaves your machines; server stores only ciphertext.
auto_sync = true
update_check = false
sync_frequency = "5m"
sync_address = "https://atuin.home.eigenmann.tech"

style = "compact"
inline_height = 25

[sync]
records = true   # v2 sync protocol
