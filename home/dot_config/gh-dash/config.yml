# Usage: `gh dash`.
prSections:
  - title: My PRs
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me -review-requested:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
defaults:
  preview:
    open: true
    width: 60
  prsLimit: 20
  issuesLimit: 20
theme:
  colors:
    text:
      primary: "#cad3f5"
      secondary: "#a5adcb"
      inverted: "#24273a"
      faint: "#6e738d"
      warning: "#eed49f"
      success: "#a6da95"
    background:
      selected: "#363a4f"
    border:
      primary: "#8aadf4" # blue accent (matches tmux/lazygit/k9s)
      secondary: "#494d64"
      faint: "#363a4f"
