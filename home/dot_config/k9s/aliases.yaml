# GVR form disambiguates across API groups for the multi-cluster bechterew/hpc/private setup.
aliases:
  dp: deployments
  sec: v1/secrets
  jo: jobs
  cr: clusterroles
  crb: clusterrolebindings
  ro: roles
  rb: rolebindings
  np: networkpolicies
  ds: apps/v1/daemonsets
  ss: apps/v1/statefulsets
  rs: apps/v1/replicasets
  cm: v1/configmaps
  svc: v1/services
  ing: networking.k8s.io/v1/ingresses
  pvc: v1/persistentvolumeclaims
  hpa: autoscaling/v2/horizontalpodautoscalers
  cj: batch/v1/cronjobs
  ev: v1/events
  sys: pods kube-system
