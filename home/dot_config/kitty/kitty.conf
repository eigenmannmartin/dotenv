# vim:ft=kitty

## Regenerate (do not hand-edit current-theme.conf): kitten themes --reload-in=all Catppuccin-Macchiato

# No font_family on purpose: kitty's default (Menlo on macOS) is the look we want.
# The FiraCode Nerd Font cask stays installed (Brewfile) — NOT as the text font, but
# as the fallback kitty pulls prompt/TUI icon glyphs from; without it they'd be tofu.
font_size        13.0
# Tighter than the default line height.
modify_font cell_height 90%

# RIGHT Option = Alt so tmux M-keys reach tmux; LEFT Option keeps composing chars on CH/DE layouts.
macos_option_as_alt right

scrollback_lines        100000
cursor_shape            beam
cursor_blink_interval   0
window_padding_width    8
enable_audio_bell       no
# `yes` and `clipboard` are the SAME value: kitty/options/utils.py::copy_on_select
# maps ('y','yes','true','clipboard') -> 'clipboard'. Spelled out so this file matches
# what `kitty --debug-config` prints.
#
# If a TUI has grabbed the mouse (nvim sets mouse=a; btop verified likewise — they
# emit DECSET 1002+1006), kitty hands the drag to the app and copy_on_select never
# runs. Hold SHIFT while dragging to force a kitty-local selection; that path DOES
# trigger copy_on_select. Shift+doubleclick = word, Shift+tripleclick = line,
# ctrl+shift+alt+drag = rectangle. All are kitty defaults — do NOT add mouse_map lines.
# Keyboard fallback on macOS: select, then cmd+c (copy_or_noop).
copy_on_select          clipboard
strip_trailing_spaces   smart
# Not kitty's default (system): paint the macOS title bar in the theme's background.
macos_titlebar_color    background

tab_bar_edge        top
tab_bar_style       separator
tab_separator       " "
tab_title_template  " {index}: {title} "

# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# Placed after the include so it always wins over the theme's background.
# Near-black neutral gray — softer than pure #000000 but without Macchiato's blue
# tint (#24273a). Rest of the palette stays; tmux uses a transparent background,
# so this propagates through it too.
background #121212

# Force ~/.config so launched tools (lazygit) don't fall back to ~/Library/Application Support.
env XDG_CONFIG_HOME=${HOME}/.config
map cmd+g launch --type=overlay --cwd=current lazygit

# Hints that COPY instead of kitty's default (insert/open). ctrl+shift+p>f, >n and >l
# are kitty's own defaults and need no line here. Comments stay on their own lines:
# kitty hands anything after the command on a `map` line, `# …` included, to the
# kitten as extra arguments, and hints then refuses to run.
# copy a file path
map ctrl+shift+p>shift+f kitten hints --type path --program @
# copy a git/SHA hash
map ctrl+shift+p>h       kitten hints --type hash --program @
# copy a word
map ctrl+shift+p>w       kitten hints --type word --program @
