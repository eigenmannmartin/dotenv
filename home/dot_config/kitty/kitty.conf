# vim:ft=kitty

## Regenerate (do not hand-edit current-theme.conf): kitten themes --reload-in=all Catppuccin-Macchiato

# Install: brew install --cask font-fira-code-nerd-font
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# RIGHT Option = Alt so tmux M-keys reach tmux; LEFT Option keeps composing chars on CH/DE layouts.
macos_option_as_alt right

scrollback_lines        100000
cursor_shape            beam
cursor_blink_interval   0
window_padding_width    8
enable_audio_bell       no
remember_window_size    yes
# `yes` and `clipboard` are the SAME value: kitty/options/utils.py::copy_on_select
# maps ('y','yes','true','clipboard') -> 'clipboard'. Spelled out so this file matches
# what `kitty --debug-config` prints.
#
# If a TUI has grabbed the mouse (nvim sets mouse=a; btop verified likewise — they
# emit DECSET 1002+1006), kitty hands the drag to the app and copy_on_select never
# runs. Hold SHIFT while dragging to force a kitty-local selection; that path DOES
# trigger copy_on_select. Shift+doubleclick = word, Shift+tripleclick = line,
# ctrl+shift+alt+drag = rectangle. All are kitty defaults — do NOT add mouse_map lines.
# Keyboard fallback on macOS: select, then cmd+c (copy_or_noop).
copy_on_select          clipboard
strip_trailing_spaces   smart
detect_urls             yes
shell_integration       enabled

hide_window_decorations            no
macos_quit_when_last_window_closed no
macos_titlebar_color               background

tab_bar_edge        top
tab_bar_style       separator
tab_separator       " "
tab_title_template  " {index}: {title} "

# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# Placed after the include so it always wins.
background_opacity 1.0

# Force ~/.config so launched tools (lazygit) don't fall back to ~/Library/Application Support.
env XDG_CONFIG_HOME=${HOME}/.config
map cmd+g launch --type=overlay --cwd=current lazygit

map ctrl+shift+p>f       kitten hints --type path --program -          # insert a file path
map ctrl+shift+p>shift+f kitten hints --type path --program @          # copy a file path
map ctrl+shift+p>n       kitten hints --type linenum                   # open file:line in $EDITOR
map ctrl+shift+p>h       kitten hints --type hash --program @          # copy a git/SHA hash
map ctrl+shift+p>l       kitten hints --type line --program -          # insert a whole line
map ctrl+shift+p>w       kitten hints --type word --program @          # copy a word
