# vim:ft=kitty

## Catppuccin Macchiato — palette lives in current-theme.conf.
## Regenerate cleanly (do not hand-edit the theme file) with:
##   kitten themes --reload-in=all Catppuccin-Macchiato

# --- Font -----------------------------------------------------------------
# FiraCode Nerd Font (install/relink: brew install --cask font-fira-code-nerd-font)
# Verify in a real kitty window:  kitty +list-fonts | grep -i fira
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# --- macOS keyboard -------------------------------------------------------
# Left Option behaves as Alt so tmux M-H / M-L (window switch) reach tmux.
# Right Option still composes accented characters (é, ü, …).
macos_option_as_alt left

# --- Look & feel ----------------------------------------------------------
scrollback_lines        100000
cursor_shape            beam
cursor_trail            3
cursor_blink_interval   0
window_padding_width    8
enable_audio_bell       no
remember_window_size    yes
copy_on_select          yes
strip_trailing_spaces   smart
detect_urls             yes
shell_integration       enabled

# --- macOS window ---------------------------------------------------------
hide_window_decorations            titlebar-only
macos_quit_when_last_window_closed no
macos_titlebar_color               background

# --- Tab bar (needs the Nerd Font above) ----------------------------------
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{index}: {title}"

# --- Theme ----------------------------------------------------------------
# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# --- Opaque background (explicit; placed after the include so it always wins)
background_opacity 1.0
