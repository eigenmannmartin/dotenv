# vim:ft=kitty

## Catppuccin Macchiato — palette lives in current-theme.conf.
## Regenerate cleanly (do not hand-edit the theme file) with:
##   kitten themes --reload-in=all Catppuccin-Macchiato

# --- Font -----------------------------------------------------------------
# FiraCode Nerd Font (install/relink: brew install --cask font-fira-code-nerd-font)
# Verify in a real kitty window:  kitty +list-fonts | grep -i fira
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# --- macOS keyboard -------------------------------------------------------
# RIGHT Option behaves as Alt so tmux M-H / M-L / M-arrows reach tmux. LEFT
# Option keeps composing characters (@ { } [ ] | \ ~ … on CH/DE layouts).
macos_option_as_alt right

# --- Look & feel ----------------------------------------------------------
scrollback_lines        100000
cursor_shape            beam
cursor_blink_interval   0
window_padding_width    8
enable_audio_bell       no
remember_window_size    yes
copy_on_select          yes
strip_trailing_spaces   smart
detect_urls             yes
shell_integration       enabled

# --- macOS window ---------------------------------------------------------
hide_window_decorations            no
macos_quit_when_last_window_closed no
macos_titlebar_color               background

# --- Tab bar (needs the Nerd Font above) ----------------------------------
tab_bar_edge        top
tab_bar_style       separator
tab_separator       " "
tab_title_template  " {index}: {title} "

# --- Theme ----------------------------------------------------------------
# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# --- Opaque background (explicit; placed after the include so it always wins)
background_opacity 1.0

# --- Launchers + env ------------------------------------------------------
# Ensure programs kitty launches (e.g. the lazygit overlay) read ~/.config —
# macOS otherwise defaults some tools to ~/Library/Application Support.
env XDG_CONFIG_HOME=${HOME}/.config
# cmd+g: float lazygit as an overlay in the current dir (Catppuccin via its config)
map cmd+g launch --type=overlay --cwd=current lazygit

# --- Hints: keyboard-grab things off the screen ---------------------------
# (ctrl+shift+e already opens URLs by default.) Chord prefix: ctrl+shift+p
map ctrl+shift+p>f       kitten hints --type path --program -          # insert a file path
map ctrl+shift+p>shift+f kitten hints --type path --program @          # copy a file path
map ctrl+shift+p>n       kitten hints --type linenum                   # open file:line in $EDITOR
map ctrl+shift+p>h       kitten hints --type hash --program @          # copy a git/SHA hash
map ctrl+shift+p>l       kitten hints --type line --program -          # insert a whole line
map ctrl+shift+p>w       kitten hints --type word --program @          # copy a word
